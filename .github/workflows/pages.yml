name: Publicar juego de supervivencia

on:
  push:
    branches: ["main"]
    paths:
      - "juego-supervivencia/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./juego-supervivencia"

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
