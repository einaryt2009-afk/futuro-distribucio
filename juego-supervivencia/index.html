<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zona Cero — Supervivencia</title>
<style>
:root{--bg:#090b12;--panel:#111522;--line:#293044;--text:#f4f6fb;--muted:#9da7bb;--accent:#7ee787;--danger:#ff6b6b;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#182036 0,#090b12 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center;overflow:hidden}
#wrap{width:min(1180px,100vw);padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.brand{font-weight:800;letter-spacing:.08em;text-transform:uppercase}.brand span{color:var(--accent)}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:rgba(17,21,34,.86);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;color:var(--muted)}
.stat b{color:var(--text);margin-left:5px}
#gameBox{position:relative;border:1px solid #30384d;border-radius:16px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.45);background:#080a0f}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:auto}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,12,.72);backdrop-filter:blur(5px)}
.card{width:min(520px,90%);background:rgba(17,21,34,.96);border:1px solid #37415a;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center}
h1{margin:0 0 8px;font-size:clamp(28px,5vw,54px);letter-spacing:-.04em}.card p{color:var(--muted);line-height:1.55}
button{border:0;border-radius:11px;padding:12px 18px;background:var(--accent);color:#07100a;font-weight:800;cursor:pointer;font-size:15px}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}
.small{font-size:12px;color:var(--muted);margin-top:14px}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(9,11,18,.88);border:1px solid #39435b;border-radius:999px;padding:8px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1}
@media(max-width:700px){#wrap{padding:8px}.stats{display:none}.brand{font-size:12px}}
</style>
</head>
<body>
<div id="wrap">
<header><div class="brand">ZONA <span>CERO</span></div><div class="stats">
<div class="stat">Oleada <b id="wave">1</b></div><div class="stat">Puntos <b id="score">0</b></div>
<div class="stat">Récord <b id="best">0</b></div><div class="stat">Vida <b id="hp">100</b>%</div>
</div></header>
<div id="gameBox">
<canvas id="game" width="960" height="540"></canvas><div id="toast"></div>
<div id="overlay"><div class="card"><h1>ZONA <span style="color:#7ee787">CERO</span></h1>
<p>Sobrevive a las oleadas. Muévete, apunta con el ratón y elimina a los infectados antes de que te rodeen.</p>
<button id="start">EMPEZAR</button><div class="small">WASD / Flechas · Ratón para apuntar · Click para disparar · P para pausa</div></div></div>
</div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;
const ui={wave:document.getElementById('wave'),score:document.getElementById('score'),best:document.getElementById('best'),hp:document.getElementById('hp'),overlay:document.getElementById('overlay'),start:document.getElementById('start'),toast:document.getElementById('toast')};
let keys={},mouse={x:W/2,y:H/2,down:false},running=false,paused=false,last=0,spawn=0,wave=1,score=0,best=+localStorage.getItem('zonaCeroBest')||0,hp=100,shots=0,kills=0;
let player,enemies=[],bullets=[],particles=[],pickups=[],shake=0,audio=null;
ui.best.textContent=best;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='p'&&running)paused=!paused});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});
c.addEventListener('mousedown',()=>{mouse.down=true;if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)()});
addEventListener('mouseup',()=>mouse.down=false);
ui.start.onclick=()=>start();

function start(){running=true;paused=false;wave=1;score=0;hp=100;shots=0;kills=0;spawn=0;enemies=[];bullets=[];particles=[];pickups=[];player={x:W/2,y:H/2,r:15,speed:205,angle:0,fire:0};ui.overlay.style.display='none';toast('OLEADA 1');}
function toast(t){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.classList.remove('show'),1300)}
function sfx(freq,dur=.05,type='square',gain=.025){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function burst(px,py,col,n=8){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=40+Math.random()*150;particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.4,max:.75,r:1+Math.random()*2,col})}}
function spawnEnemy(){const side=Math.floor(Math.random()*4);let ex=side<2?(side?W+25:-25):Math.random()*W,ey=side>=2?(side===2?-25:H+25):Math.random()*H;const elite=Math.random()<Math.min(.12,wave*.012);enemies.push({x:ex,y:ey,r:elite?19:13,hp:elite?3:1,max:elite?3:1,speed:(elite?42:58)+wave*3+Math.random()*18,elite});}
function shoot(){if(player.fire>0)return;player.fire=.115;const a=player.angle;bullets.push({x:player.x+Math.cos(a)*19,y:player.y+Math.sin(a)*19,vx:Math.cos(a)*650,vy:Math.sin(a)*650,life:.85});shots++;sfx(170,.035,'square',.018);burst(player.x+Math.cos(a)*20,player.y+Math.sin(a)*20,'#ffd166',3)}
function update(dt){
 if(paused)return;
 const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1;
 player.x=Math.max(20,Math.min(W-20,player.x+dx/len*player.speed*dt));player.y=Math.max(20,Math.min(H-20,player.y+dy/len*player.speed*dt));
 player.angle=Math.atan2(mouse.y-player.y,mouse.x-player.x);player.fire=Math.max(0,player.fire-dt);if(mouse.down)shoot();
 spawn-=dt;if(spawn<=0){const count=Math.min(3,1+Math.floor(wave/5));for(let i=0;i<count;i++)spawnEnemy();spawn=Math.max(.25,1.05-wave*.035)}
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});
 bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
 enemies.forEach(e=>{const a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;
   if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){hp-= (e.elite?17:9)*dt;shake=5;if(Math.random()<.05)burst(player.x,player.y,'#ff6b6b',3)}
 });
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.hp--;bullets.splice(j,1);burst(b.x,b.y,e.elite?'#c084fc':'#ff6b6b',5);if(e.hp<=0){score+=e.elite?40:10;kills++;if(Math.random()<.08)pickups.push({x:e.x,y:e.y,r:7,type:'heal'});burst(e.x,e.y,e.elite?'#c084fc':'#ff6b6b',14);sfx(e.elite?90:130,.08,'sawtooth',.025);enemies.splice(i,1);break}}}}
 pickups.forEach(p=>{if(Math.hypot(player.x-p.x,player.y-p.y)<player.r+p.r){hp=Math.min(100,hp+18);score+=15;burst(p.x,p.y,'#7ee787',10);sfx(520,.09,'sine',.025);p.dead=true}});pickups=pickups.filter(p=>!p.dead);
 if(kills>=wave*12){wave++;toast('OLEADA '+wave);burst(W/2,H/2,'#7ee787',30);sfx(600,.15,'sine',.03)}
 if(hp<=0){running=false;best=Math.max(best,score);localStorage.setItem('zonaCeroBest',best);ui.best.textContent=best;ui.overlay.style.display='grid';ui.overlay.querySelector('h1').innerHTML='FIN DE LA <span style="color:#ff6b6b">PARTIDA</span>';ui.overlay.querySelector('p').innerHTML='Has llegado a la oleada <b>'+wave+'</b> con <b>'+score+'</b> puntos. El récord se guarda en este dispositivo.';ui.start.textContent='JUGAR DE NUEVO';sfx(70,.35,'sawtooth',.04)}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt});particles=particles.filter(p=>p.life>0);
 ui.wave.textContent=wave;ui.score.textContent=score;ui.hp.textContent=Math.max(0,Math.ceil(hp));
}
function draw(){
 x.clearRect(0,0,W,H);
 const g=x.createRadialGradient(W/2,H/2,40,W/2,H/2,600);g.addColorStop(0,'#151b2a');g.addColorStop(1,'#070910');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
 // grid / arena
 x.strokeStyle='rgba(126,231,135,.045)';x.lineWidth=1;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=48){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
 // pickups
 pickups.forEach(p=>{x.fillStyle='#7ee787';x.shadowBlur=18;x.shadowColor='#7ee787';x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#08100a';x.fillRect(p.x-2,p.y-5,4,10);x.fillRect(p.x-5,p.y-2,10,4)});
 // bullets
 bullets.forEach(b=>{x.strokeStyle='#ffd166';x.lineWidth=3;x.beginPath();x.moveTo(b.x-b.vx*.012,b.y-b.vy*.012);x.lineTo(b.x,b.y);x.stroke()});
 // enemies
 enemies.forEach(e=>{x.save();x.translate(e.x,e.y);const a=Math.atan2(player.y-e.y,player.x-e.x);x.rotate(a);x.fillStyle=e.elite?'#9b5de5':'#d34f4f';x.shadowBlur=14;x.shadowColor=x.fillStyle;x.beginPath();x.arc(0,0,e.r,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#161018';x.beginPath();x.arc(5,-4,3,0,Math.PI*2);x.arc(5,4,3,0,Math.PI*2);x.fill();x.fillStyle='#f7f1e3';x.beginPath();x.moveTo(e.r-2,-5);x.lineTo(e.r+7,0);x.lineTo(e.r-2,5);x.fill();x.restore();if(e.elite){x.fillStyle='#33253d';x.fillRect(e.x-20,e.y-e.r-9,40,4);x.fillStyle='#c084fc';x.fillRect(e.x-20,e.y-e.r-9,40*(e.hp/e.max),4)}});
 // player
 if(player){x.save();x.translate(player.x,player.y);x.rotate(player.angle);x.fillStyle='rgba(126,231,135,.12)';x.beginPath();x.arc(0,0,29,0,Math.PI*2);x.fill();x.fillStyle='#dce7df';x.beginPath();x.arc(0,0,15,0,Math.PI*2);x.fill();x.fillStyle='#7ee787';x.fillRect(5,-5,22,10);x.fillStyle='#0c1510';x.beginPath();x.arc(-3,-5,2.5,0,Math.PI*2);x.arc(-3,5,2.5,0,Math.PI*2);x.fill();x.restore()}
 particles.forEach(p=>{x.globalAlpha=Math.max(0,p.life/p.max);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.globalAlpha=1});
 x.restore();
 if(paused&&running){x.fillStyle='rgba(0,0,0,.45)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='800 34px system-ui';x.textAlign='center';x.fillText('PAUSA',W/2,H/2)}
}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
